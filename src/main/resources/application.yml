spring:
  config:
      # Funciona tanto al abrir "Backend" como al ejecutar desde la raíz del proyecto en VS Code.
      import: optional:file:./.env[.properties],optional:file:./Backend/.env[.properties]
  application:
    name: tienda-juegos-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: ${SERVER_PORT:8080}

